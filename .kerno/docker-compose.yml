services:
  postgres:
    image: "postgres:16-alpine"
    pull_policy: missing
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      - "POSTGRES_USER=test_user"
      - "POSTGRES_PASSWORD=test_password"
      - "POSTGRES_DB=test_db"
    ports:
      - "5432"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U test_user -d test_db"
      interval: "3s"
      timeout: "5s"
      retries: "10"
    tmpfs:
      - /var/lib/postgresql/data
    labels:
      - external-url=postgresql://localhost:{{PORT}}/test_db?user=test_user&password=test_password

  sut:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile_inline: |
        FROM python:3.10-slim

        # Install system dependencies
        RUN apt-get update && apt-get install -y \
            curl \
            postgresql-client \
            && rm -rf /var/lib/apt/lists/*

        # Upgrade pip and install poetry
        RUN pip install -U pip \
            && pip install --no-cache-dir poetry

        # Set working directory
        WORKDIR /app

        # Copy dependency files
        COPY poetry.lock pyproject.toml /app/

        # Configure poetry and install dependencies (production only, without installing the project itself)
        RUN poetry config virtualenvs.create false \
            && poetry install --only main --no-interaction --no-ansi --no-root

        # Copy application code
        COPY . /app/

        # Set default command
        CMD ["python", "-m", "flask", "run", "--host=0.0.0.0"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "5000"
    command: >
      sh -c "poetry run alembic upgrade head && python -m flask run --host=0.0.0.0"
    labels:
      - jwt-signing-config=HS256:this_is_a_secret_meeting_all_requirements_of_any_hs_algorithms
